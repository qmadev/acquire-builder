[package]
name = "acquire-builder"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
clap-verbosity = "2.1.0"
dunce = "1.0.5"
env_logger = { version = "0.11.8", features = ["color"] }
flate2 = "1.1.9"
log = "0.4.29"
once_cell = "1.21.4"
reqwest = { version = "0.13.2", features = ["blocking", "http2", "rustls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.45"
toml = "0.9.11"
walkdir = "2.5.0"
zip = { version = "7.4.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"
